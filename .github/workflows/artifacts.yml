name: Artifacts (Package)

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  artifacts-mingw-w64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup problem matcher
      uses: Joshua-Ashton/gcc-problem-matcher@master

    - name: Setup MinGW and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 g++-mingw-w64-x86-64 g++-mingw-w64-i686 meson ninja-build glslang-tools

    - name: Build release and RAT package
      id: build-release
      shell: bash
      run: |
        export VERSION_NAME="${GITHUB_REF##*/}-${GITHUB_SHA##*/}"
        ./package-release.sh ${VERSION_NAME} build --no-package
        ./package-rat.sh ${VERSION_NAME} build
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-win-${{ env.VERSION_NAME }}
        path: |
          build/dxvk-${{ env.VERSION_NAME }}
          build/*.rat
        if-no-files-found: error

  artifacts-steamrt-sniper:
    runs-on: ubuntu-latest
    container: 
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:beta
      options: --user 1001

    steps:
    - name: Checkout code
      id: checkout-code
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup problem matcher
      uses: Joshua-Ashton/gcc-problem-matcher@master

    - name: Build release
      id: build-release
      shell: bash
      run: |
        export VERSION_NAME="${GITHUB_REF##*/}-${GITHUB_SHA##*/}"
        ./package-native.sh ${VERSION_NAME} build
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV

    - name: Upload artifacts
      id: upload-artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dxvk-native-${{ env.VERSION_NAME }}
        path: build/dxvk-native-${{ env.VERSION_NAME }}.tar.gz
        if-no-files-found: error

  merge-artifacts:
    runs-on: ubuntu-latest
    needs: [artifacts-mingw-w64, artifacts-steamrt-sniper]
    steps:
      - name: Get version
        id: get-version
        shell: bash
        run: |
          echo "VERSION_NAME=${GITHUB_REF##*/}-${GITHUB_SHA##*/}" >> $GITHUB_ENV

      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: dxvk-${{ env.VERSION_NAME }}
          pattern: dxvk*
          delete-merged: true

  release:
    runs-on: ubuntu-latest
    needs: [artifacts-mingw-w64, artifacts-steamrt-sniper, merge-artifacts]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dxvk-${{ env.VERSION_NAME }}
          path: release-files
        continue-on-error: true

      - name: Setup Release Variables
        id: release-vars
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF##*/}-${GITHUB_SHA##*/}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v3.0.2-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Windroid DXVK ${{ env.TAG_NAME }}"
          body: |
            ### 🎮 Windroid DXVK Release
            
            - **Compatibilidade:** Suporte e correção para drivers Turnip 26xx no Android / Wine / Box64 (fallback automático para `vkQueueSubmit`).
            - **Instalação no Emulador:** Baixe o arquivo `.rat` anexado e instale diretamente no **Windroid Emulator**.
          files: |
            release-files/**/*.rat
            release-files/**/*.tar.gz
            release-files/*.rat
            release-files/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
